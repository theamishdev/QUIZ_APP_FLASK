{% extends "base.html" %}
{% block content %}
<div class="glass-card" style="max-width: 600px; margin: 2rem auto;">
    <div style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem;">
        <div style="width: 80px; height: 80px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700;">
            {{ current_user.username[0].upper() }}
        </div>
        <div>
            <h2>Account Details</h2>
            <p class="text-muted">Manage your profile and settings</p>
        </div>
    </div>

    <form method="POST">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="fullname" class="form-control" value="{{ current_user.fullname if current_user.fullname else '' }}" placeholder="Enter your full name">
        </div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" class="form-control" value="{{ current_user.username }}" required>
        </div>
        <div class="form-group">
            <label>Email address</label>
            <input type="email" name="email" class="form-control" value="{{ current_user.email }}" required>
        </div>
        <button type="submit" class="btn btn-primary">Update Profile</button>
    </form>
</div>
{% endblock %}
