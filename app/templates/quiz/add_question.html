{% extends "base.html" %}
{% block content %}
<div class="glass-card" style="max-width: 700px; margin: 2rem auto;">
    <h2>Add Question to: {{ quiz.title }}</h2>
    <form method="POST">
        <div class="form-group">
            <label>Question Text</label>
            <input type="text" name="question_text" class="form-control" required>
        </div>
        
        <div class="choices-container">
            <label>Choices (Select the correct one)</label>
            {% for i in range(4) %}
                <div class="choice-row" style="display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem;">
                    <input type="radio" name="correct_choice" value="{{ i }}" {{ 'checked' if i == 0 }}>
                    <input type="text" name="choices" class="form-control" placeholder="Choice {{ i+1 }}" required>
                </div>
            {% endfor %}
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" name="add_another" class="btn btn-secondary" style="background: #334155;">Add & Another</button>
            <button type="submit" name="done" class="btn btn-primary">Add & Finish</button>
        </div>
    </form>
</div>
{% endblock %}
