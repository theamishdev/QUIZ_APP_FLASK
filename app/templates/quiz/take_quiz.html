{% extends "base.html" %}
{% block content %}
<div class="glass-card" style="max-width: 800px; margin: 2rem auto;">
    <h1>{{ quiz.title }}</h1>
    <p class="text-muted">{{ quiz.description }}</p>
    <hr style="border: 0.5px solid var(--glass-border); margin: 2rem 0;">

    <form action="{{ url_for('quiz.submit_quiz', quiz_id=quiz.id) }}" method="POST">
        {% for question in quiz.questions %}
            <div class="question-block" style="margin-bottom: 2.5rem;">
                <h3>{{ loop.index }}. {{ question.question_text }}</h3>
                <div class="choices-list" style="margin-top: 1rem; display: grid; gap: 0.75rem;">
                    {% for choice in question.choices %}
                        <label class="choice-item glass-card" style="padding: 1rem; cursor: pointer; display: flex; align-items: center; gap: 1rem; margin: 0;">
                            <input type="radio" name="question_{{ question.id }}" value="{{ choice.id }}" required>
                            <span>{{ choice.choice_text }}</span>
                        </label>
                    {% endfor %}
                </div>
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; padding: 1rem;">Submit Quiz</button>
    </form>
</div>

<style>
    .choice-item:has(input:checked) {
        border-color: var(--primary);
        background: rgba(99, 102, 241, 0.2);
    }
</style>
{% endblock %}
