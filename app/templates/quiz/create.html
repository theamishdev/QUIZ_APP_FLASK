{% extends "base.html" %}
{% block content %}
<div class="glass-card" style="max-width: 700px; margin: 2rem auto;">
    <h2>Create New Quiz</h2>
    <p class="text-muted">Start by giving your quiz a title and description.</p>
    <form method="POST">
        <div class="form-group">
            <label>Quiz Title</label>
            <input type="text" name="title" class="form-control" placeholder="e.g. Python Basics" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" class="form-control" rows="3" placeholder="What is this quiz about?"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Next: Add Questions</button>
    </form>
</div>
{% endblock %}
