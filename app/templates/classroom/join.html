{% extends "base.html" %}
{% block content %}
<div class="glass-card" style="max-width: 500px; margin: 4rem auto;">
    <h2>Join a Classroom</h2>
    <p class="text-muted">Enter the code provided by your teacher.</p>
    <form method="POST">
        <div class="form-group">
            <label>Join Code</label>
            <input type="text" name="join_code" class="form-control" placeholder="X1Y2Z3" style="text-transform: uppercase;" required>
        </div>
        <button type="submit" class="btn btn-primary">Join Room</button>
    </form>
</div>
{% endblock %}
